# drupilot CI: the same gates a developer runs locally, through the single gate
# implementation (scripts/dev/check.sh). The workflow only installs tools and
# calls it, so local runs and CI never drift. Nothing here needs Docker-in-DDEV,
# PHP or a Drupal site: the smoke gate (scripts/dev/smoke.sh) runs the
# Docker-free scripts against tests/fixtures/.
name: CI

on:
  push:
    branches: [main, "integration/**", "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELLCHECK_VERSION: v0.11.0
  # The schema validator of the `schemas` gate (CI-only, never a plugin
  # runtime dependency; docs/contributing/adr/0010-schema-validator.md).
  CHECK_JSONSCHEMA_VERSION: 0.38.2

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS runs the whole gate twice (bash 5, then the stock /bin/bash 3.2).
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq libxml2-utils
          # A pinned ShellCheck (the distro package lags behind and reports a
          # different warning set than the version the gate is tuned for).
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
          pipx install "check-jsonschema==${CHECK_JSONSCHEMA_VERSION}"

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: |
          # xmllint ships with macOS. Homebrew bash is installed only for the
          # bash 5 leg below; the stock /bin/bash 3.2 leg runs afterwards.
          brew install jq bash
          # The same pinned ShellCheck as on Linux (Homebrew ships whatever is
          # current, whose warning set the strict gate is not tuned for).
          case "$(uname -m)" in
            arm64) SC_ARCH=aarch64;;
            *) SC_ARCH=x86_64;;
          esac
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.darwin.${SC_ARCH}.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
          pipx install "check-jsonschema==${CHECK_JSONSCHEMA_VERSION}"

      - name: Tool versions
        run: |
          bash --version | head -n 1
          /bin/bash --version | head -n 1
          shellcheck --version | sed -n 2p
          jq --version
          xmllint --version 2>&1 | head -n 1
          check-jsonschema --version
          awk --version 2>/dev/null | head -n 1 || awk -W version 2>/dev/null | head -n 1 || true

      # `claude plugin validate` runs in its own job (plugin-validate) so the
      # shell gates report independently of the npm registry.
      - name: check.sh --ci (gates + smoke tests)
        run: bash scripts/dev/check.sh --ci --skip validate

      - name: check.sh --ci under the stock /bin/bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          # /bin first, so every `bash` a script spawns is the stock 3.2 too;
          # Homebrew (shellcheck, jq) stays further down the PATH.
          env PATH="/bin:/usr/bin:$PATH" /bin/bash scripts/dev/check.sh --ci --skip validate

      - name: Working tree untouched
        run: |
          test -z "$(git status --porcelain --ignored)" || { git status --porcelain --ignored; exit 1; }

  minimal-userlands:
    name: smoke in ${{ matrix.image }}
    runs-on: ubuntu-latest
    # debian:12-slim runs the unit tests with mawk and jq 1.6, the slowest
    # tools drupilot supports (the resolver's tests alone take minutes there).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Alpine with bash 3.2 and BusyBox awk/sed/grep: the most minimal
          # userland the scripts must still work on.
          - image: bash:3.2
            setup: apk add --no-cache jq git
          # mawk 1.3.4 and jq 1.6: the floors drupilot declares (Debian 12,
          # and Ubuntu 22.04 alike).
          - image: debian:12-slim
            setup: apt-get update -qq && apt-get install -y -qq jq git
    steps:
      - uses: actions/checkout@v4
      - name: check.sh --smoke
        env:
          IMAGE: ${{ matrix.image }}
          SETUP: ${{ matrix.setup }}
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo -e SETUP "$IMAGE" \
            sh -c 'eval "$SETUP" >/dev/null && bash scripts/dev/check.sh --smoke --skip validate'

  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISABLE_AUTOUPDATER: "1"
      DISABLE_TELEMETRY: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # `claude plugin validate` needs no login or API key. Non-strict on
      # purpose: --strict fails on the CLAUDE.md-at-the-plugin-root warning.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: check.sh --ci --only validate
        run: bash scripts/dev/check.sh --ci --only validate
